[project]
name = "tibdaftari-backend"
version = "0.1.0"
description = "TibDaftari — multi-tenant clinic platform API (FastAPI + PostgreSQL + Redis)"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W", "RUF"]
ignore = ["S101", "S105", "S106", "B008", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
"migrations/*" = ["I", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
